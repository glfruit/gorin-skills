name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git diff --check
      - name: Reject stale v1 source references in active entry docs
        run: |
          ! rg -n 'general/|skills/edu/|openclaw/neobear|openclaw/\*/' README.md CONTRIBUTING.md docs/architecture.md docs/skill-development-guide.md
      - name: Syntax-check shell helpers without executing them
        run: |
          while IFS= read -r script; do bash -n "$script"; done < <(rg --files -g '*.sh')
