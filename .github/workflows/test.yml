name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Verify lifecycle transitions against the released baseline
        run: |
          version="$(node -e "const fs=require('fs'); const YAML=require('yaml'); process.stdout.write(YAML.parse(fs.readFileSync('release/repository.yaml','utf8')).version)")"
          node scripts/gorin-skills.mjs validate --baseline "release/baselines/catalog-$version.json"
      - name: Verify generated catalog
        run: |
          node scripts/gorin-skills.mjs catalog --output /tmp/gorin-catalog.json
          diff -u catalog/index.json /tmp/gorin-catalog.json
      - name: Verify generated human index
        run: |
          node scripts/gorin-skills.mjs docs --output /tmp/gorin-skills-index.md
          diff -u docs/skills/index.md /tmp/gorin-skills-index.md
      - name: Build every declared target and compatibility alias
        run: node scripts/gorin-skills.mjs build --all --output /tmp/gorin-targets
      - name: Resolve release profiles
        run: |
          for profile_file in profiles/*.yaml; do
            profile="$(basename "$profile_file" .yaml)"
            node scripts/gorin-skills.mjs profile --name "$profile" > "/tmp/$profile.json"
          done
      - name: Qualify every candidate through target build and managed install
        run: |
          node -e "const c=require('./catalog/index.json'); for (const s of c.skills.filter(s => s.lifecycle === 'candidate')) console.log(s.id)" |
            while IFS= read -r skill; do
              node scripts/gorin-skills.mjs qualify --skill "$skill" > "/tmp/$skill-qualification.json"
            done
      - name: Generate and verify a pending release in an isolated staging area
        shell: bash
        run: |
          if compgen -G 'release/fragments/*.yaml' > /dev/null; then
            node scripts/gorin-skills.mjs release --dry-run > /tmp/gorin-release-plan.json
          else
            echo "No pending release fragments; released baseline was verified above."
          fi
